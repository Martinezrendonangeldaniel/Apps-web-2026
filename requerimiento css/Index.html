<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Ayuda - SegundaOportunidAPP</title>
    
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <!-- Tu archivo CSS personalizado -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>    
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Tarjeta contenedora con diseño limpio -->
                <div class="card shadow-sm p-4 border-0">
                    <h1 class="h3 mb-2 fw-bold text-dark">Formulario de Ayuda y Reportes</h1>
                    <p class="text-muted mb-4">Completa los siguientes datos:</p>

                    <form>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Escribe tu nombre">
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo:</label>
                            <!-- type="text" para que acepte cualquier valor sin exigir el @ -->
                            <input type="text" class="form-control" id="correo" name="correo" placeholder="Escribe tu correo">
                        </div>

                        <div class="mb-3">
                            <label for="asunto" class="form-label">Tipo de reporte:</label>
                            <select class="form-select" id="asunto" name="asunto">
                                <option selected disabled>Elige una opción</option>
                                <option>Fallo en la página</option>
                                <option>Duda sobre una donación</option>
                                <option>Otro motivo</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Detalle del problema:</label>
                            <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Explica qué sucedió"></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-custom-primary btn-lg">Enviar Reporte</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
